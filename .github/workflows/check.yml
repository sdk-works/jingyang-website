name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JSON validation
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if name.endswith('.json'):
                  json.loads(Path(name).read_text(encoding='utf-8-sig'))
          PY
      - name: Backend syntax
        run: find backend -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      - name: Whitespace validation
        run: git show --format= --check HEAD
