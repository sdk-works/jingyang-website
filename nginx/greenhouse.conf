# ============================================================
# Nginx 配置 - 山东京阳温室科技官网 v6
# 文件位置: /etc/nginx/sites-available/greenhouse
# 启用: ln -s /etc/nginx/sites-available/greenhouse /etc/nginx/sites-enabled/
#
# 架构说明：
#   Nginx（80/443）→ 静态资源直接服务
#                 → /api/* 代理到后端 Node.js :4000
#                 → 其余请求代理到前端 Node.js :3000（standalone）
#
# 内存优化要点：
#   - /_next/static/ 由 Nginx 直接托管（来自 frontend/.next/standalone/）
#   - /images/、/uploads/ 由 Nginx 直接托管
#   - 只有动态请求才转发到 Node 进程，大幅减少 Node 内存压力
# ============================================================

# 限速区域
limit_req_zone $binary_remote_addr zone=api:10m     rate=20r/s;
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload:10m  rate=10r/m;

# ── HTTP → HTTPS 重定向 ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.jingyang-greenhouse.com jingyang-greenhouse.com;

    # Let's Encrypt ACME 验证（certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ── HTTPS 主服务 ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jingyang-greenhouse.com jingyang-greenhouse.com;

    # ── SSL 证书（Let's Encrypt）──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/jingyang-greenhouse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jingyang-greenhouse.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── 安全响应头 ──────────────────────────────────────────────
    add_header X-Content-Type-Options   nosniff                           always;
    add_header X-Frame-Options          SAMEORIGIN                        always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ── 基础配置 ──────────────────────────────────────────────
    client_max_body_size 20M;     # 图片上传大小限制
    keepalive_timeout    65;
    server_tokens        off;     # 隐藏 Nginx 版本号

    # ── Gzip 压缩 ──────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── 日志 ──────────────────────────────────────────────────
    access_log /var/log/nginx/greenhouse_access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/greenhouse_error.log warn;

    # ============================================================
    # 静态资源：由 Nginx 直接托管（不经过 Node，内存最省）
    # ============================================================

    # Next.js 构建产物（JS/CSS，永久缓存，文件名含哈希）
    # Next.js 构建产物静态资源
    # standalone 模式构建后，需先执行：
    #   cp -r .next/static .next/standalone/.next/static
    # 然后 Nginx 从 standalone 目录托管（由 deploy.sh/clear-cache.sh 自动处理）
    location /_next/static/ {
        alias /var/www/greenhouse/frontend/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 网站静态图片（产品/案例/新闻/关于页面图片）
    # 修改图片后需执行 nginx -s reload 使缓存失效
    location /images/ {
        alias /var/www/greenhouse/frontend/public/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # 图片不存在时返回 404 而非代理到 Node
        try_files $uri =404;
        access_log off;
    }

    # 后台上传的图片/视频文件
    location /uploads/ {
        alias /var/www/greenhouse/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 防止直接浏览目录
        autoindex off;
        # 只允许图片和视频类型
        location ~* \.(jpg|jpeg|png|gif|webp|mp4|mov|avi)$ {
            add_header Cache-Control "public, max-age=604800";
        }
        access_log off;
    }

    # Favicon 和 robots.txt
    location = /favicon.ico { alias /var/www/greenhouse/frontend/public/favicon.ico; access_log off; }
    location = /robots.txt  { alias /var/www/greenhouse/frontend/public/robots.txt;  access_log off; }

    # ============================================================
    # 后端 API（代理到 Node.js :4000）
    # ============================================================

    # 联系表单（严格限速：5次/分钟）
    location = /api/contact {
        limit_req zone=contact burst=2 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
    }

    # 图片上传（限速）
    location = /api/admin/upload {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:4000;
        proxy_read_timeout 60s;
        include /etc/nginx/proxy_params;
    }

    # 其余 API 接口
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
    }

    # 健康检查（不记录日志）
    location = /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }

    # ============================================================
    # 前端 Next.js（代理到 standalone :3000）
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;

        # 后端故障时显示维护页
        # error_page 502 503 504 /maintenance.html;
    }
}
